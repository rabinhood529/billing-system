
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Billing System{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #17243a;
            color: white;
        }

        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: block;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .sidebar a:hover {
            background-color: #304a70;
            color: white;
        }

        .main-content {
            flex: 1;
            min-width: 0;
        }

        .topbar {
            background-color: white;
            padding: 15px 25px;
            border-bottom: 1px solid #e5e7eb;
        }
      </style>

    {% block extra_css %}
    {% endblock %}

</head>
<body>

    <div class="d-flex">

        <!-- Sidebar -->
        <aside class="sidebar p-3">

            <h4 class="mb-4">Billing System</h4>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Products</a>
                <a href="#">Customers</a>
                <a href="#">Billing / POS</a>
                <a href="#">Invoices</a>
                <a href="#">Inventory</a>
                <a href="#">Reports</a>
            </nav>

        </aside>

        <!-- Main Content -->
        <div class="main-content">

            <!-- Top Navigation -->
            <header class="topbar d-flex justify-content-between align-items-center">

                <h5 class="mb-0">Admin Panel</h5>

                <span class="text-muted">Welcome, Admin</span>

            </header>

            <!-- Page Content -->
            <main class="p-4">

                {% block content %}
                {% endblock %}

            </main>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
