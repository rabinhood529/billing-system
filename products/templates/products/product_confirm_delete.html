{% extends "core/base.html" %}

{% block title %}
Delete Product | Billing System
{% endblock %}

{% block content %}

<div class="mb-4">
    <h3>Delete Product</h3>
    <p class="text-muted">Confirm before deleting this product.</p>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body">

        <p>
            Are you sure you want to delete
            <strong>{{ product.name }}</strong>?
        </p>

        <p class="text-danger">
            This action cannot be undone.
        </p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Delete Product
            </button>

            <a href="{% url 'product_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
